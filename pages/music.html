    <div class = "music-content">
        <main class="main">    
        <h1>Eronium's Records</h1>
        <p>The corner where anything related to Eronium and NX records can be found.</p>
        <h2>Currently Working On:</h2>
        <div class="wip">
            <h3>DAWN</h3>
            <h4>The next 10-16 song album by Eronium.</h4>
        </div>  
        <h2>LATEST RELEASE:</h2>
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/1sHOAwit0ln03XBHm2sMQ5?utm_source=generator&si=368972a525a14e8b" width="80%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </main>

        <div class = "vinyl-player">
            <div class = "vinyl-cover"><i class = "fas fa-record-vinyl" aria-hidden="true"></i></div>
            <audio id = "myAudio">  </audio>
            <div class = "controls">
                <button class = "prev" id = "prev" aria-label="previous track"><i class = "fas fa-backward" aria-hidden="true"></i></button>
                <button class = "play-pause" id = "playPause" aria-label="play or pause"><i class = "fas fa-play" aria-hidden="true"></i></button>
                <button class = "next" id = "next" aria-label="next track"><i class = "fas fa-forward"  aria-hidden="true"></i></button>
            </div>      
            
            <div class = "progress-bar" id="progress-bar">
                <div class = "progress" id="progress"></div>
            </div>
            <span class = "current-time" id="current-time">0:00</span> / <span class = "duration" id="duration">0:00</span>
            <input class = "volume" id = "volume" type = "range" min = "0" max = "1" step = "0.01" value = "1" aria-label = "volume slider">
            <h3 id = "track-title">Select a track</h3>
            <ul id = "track-list" class = "track-list">
                <li data-src="../music/rush lofi.wav">RUSH (Lo-fi)</li>
                <li data-src="../music/nevertheless lofi.wav">Nevertheless (Lo-fi)</li>
            </ul>
        </div>
